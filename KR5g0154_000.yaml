front:
  text: 洞真太上道君元丹上經內五
  hash: sha256:f615e149d3709f7bb8f753098126b738b6e54309ba4a14269e9d14de6405fb27
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5g0154_HFL_000-001a, image: hfl/1032/1032-106.png}
body:
  text: 青童大君傳太帝君太上天帝君太微天帝君三尊君三君昔之奉受玄丹上經於太上道君施行奉修道成上輔帝王之真臨升霄之日太帝君以真經傳授西王毋太上天帝君以經傳授南極上元君太微天帝君以真經傳授金闕聖君金闕聖君以真經傳授上相青童君上相青童君以真經傳涓子此經是素靈上篇此道髙妙非中仙所可得聞自非名書絳簡緑字太極者玄丹上經不相遭遇覩聞也道士若備修太上三真品經者位為帝皇之上公上卿也若所遭受者偏聞道有限者位為小有靈宫之王神州之卿太極中下大夫耳亦得騁龍駕雲乘飛控虛神宫𨗳衛散影八遐矣微乎深玄難以輕宣品經之目太上隱書八素篇中有俯仰之格限也當隱靜專修所行勤至之心愈彌於住也真人因是遂有形貌之漸矣自非爾師且勿言於他人又耳中聞簫角之音吉象貴至也聞呌喚號呼之聲者凶象賤至也聞臰氣者必有厭穢之事不淨潔之𦍙驗也故以臰氣示之矣輒更沐浴燒香掃除寢室以答之此是帝君將誡勸於人者也若聞香氣者是神官靈人在子側也視子之狀也其時當修好事行德惠拯窮困布隂功施惠愛神官靈人還將告子於太上道子之善否也道之微妙而不可不察皆此類象也聞香氣自非爾師勿告他人聞臰氣者當告之以明巳之犯罪觸穢之旡狀也若聞血氣及旡故見聚血者兵凶也急隱遁人間守三元帝君求救自藏齋三月禍亦亡此皆帝君告人之吉凶以令懼戒其禍福耳夫見凶象當行隂隲營惠救人為人所不能為行人所不能行者始免乎必死之候也子其朂之勿守常而巳兩眉間上却入三分為守寸雙田却入一寸為明堂宫却入二寸為洞房宫却入三寸為丹田宫却人四寸為流珠宫却入五寸為玉帝宫凡存修上法先叩天鼓措手掩耳而呪曰赤子在宫九真在房請聽神命永察不祥太一流火以滅萬殃呪畢以手拍耳門一七過畢當覺面熱即佳候也若覺頭項頸間色色寒者惡氣入也當急卧瞑目存玄丹宫太一真君以流火之鈴煥而擲之令惡氣即出身外火光亦隨之在後炯炯然照一身良久平復也耳中忽聞瀨水聲者雷霆及鼓鳴者是體中勞損心藏極弊不能味真注生而淫故喪亂使六府失攝魂魄哀號蓋將結疾致死亡之兆矣是以泥丸縱法九宫失常悲擾翻錯鳴鼓亂行欲捨其居館以棄一身也聞之者當精思念太一真君悉還專真心若罪未深者自聽攺過也所以身聾耳神亡之矣夫耳者帝君之聽門也目者太一之日月也鼻者三元之丘山也口者絳宫之朱淵也眉者白元之華蓋也髮者明堂之林精也舌者旡英之龍轅也齒者胃宫之威力也手者膽神之外援也足者腎元之靈關也隂極者洞房之真機也夫一骸百神各有所屬不可不察不可不慎也耳中忽聞金聲玉音者真氣來入道欲成也忽聞弦樂之聲音六丁玉女來衛子皆道欲成兩眉間上其裏有黃闕紫户絳臺青房共構立守寸之中左右耳守寸左面有絳臺右面有黃闕其九宫真人出入皆從黃闕絳臺中間為道以導之故左右置臺闕臺闕者以伺非常之氣候也迎真人之往來也紫户大神名平靜字法王也青房大神名正心字𥘉方形並如嬰孩各服衣如其方房户之色手執流金火鈴守寸却入三分名為守寸也旦暮夜卧及存思之時先存二大神髣佛存見仍三呼神名諱畢微祝曰紫户青房有二大神手把流鈴身生風雲俠衛真道不聽外前使我思感通利靈關出入利貞上登九門即見九真太上之尊呪畢乃可存思三一洞房九道諸要道守寸二大神唯聽九宫中真官在九宫內者出入耳目上帝之信命及玉童靈真賢聖仙人往來諸帝軒二大神許聽以進其餘非真此二大神皆不聽進以前入內宫中此中黃太一法度也於是赤子帝君乃命兩耳神嬌女雲儀使引進之故人覺耳鳴者外使入也使有好惡雲儀時扣磬鍾以聞九宫使知外使來入令警備也磬鐘者是令耳鳴之聲音也其聞之者措手掩耳而呪曰赤子在宫九真在房請聽神命永察不祥丹田中有上元真一帝君帝君之卿合三人共治丹田宫守三元真一之道是也此地真之要旨挺乘龍車之經也天尊多樂欲為地真人地真人隱遁於官位不勞損於朝宴故從容任適隨時而逰坐七輿以上造步一氣於太旡至於天真地真雖差階小異俱一真矣人亦各安其所之不願復為雲中官也玄丹宫有泥丸太一真君丹田後却入一寸為流珠宫流珠宫真神自别有經司命之所行也其道妙大𧵥誓用珠帛結盟乃能付之此經三百嵗一傳滿出授止不復得出此太極公卿司命之道玄丹宫在丹田之上正方一寸紫房緑室朱煙滿內其中有泥丸太一真君治玄丹之宫太一真君貌如嬰兒始生之狀坐在金牀玉帳之中著紫繡錦衣腰帶流火之鈴流火之鈴者旡質而赤光動之聲聞千萬里蓋上清中黃太一真人之寶鈴也左手把北斗七星之柄右手把北辰之綱北辰者北極不動之星謂之辰綱正坐玄丹宫向外左右旡侍其旡侍者所以名之謂太一真君也常以旦夕守諸三一訖獨後乃未存之末存之者先造其輕後行其重也夫人一頭有九宫請先説之兩眉間上其裏有黃闕又存之畢因三呼三君名諱叩天鼓二十四通千妖自伏萬鬼邪精滅形若道士肌渴亦存三君並口吐赤氣使灌已口中口中吸而咽之須臾飽也若道士夜行暗不見道路存三君使口吐出三火光照前須臾道路自明朗也又若行凶處危難之中有刀兵危急之地急存之使三君鳴玉鈴精而思想之敵人自然心駭意懾不復生惡逆害心也若道士欲求延年益夀不死及病困臨當救濟而生者正心安寢精思存明堂三君並向外長跪口吐赤氣使光貫我身令匝我口傍咽赤氣唯多旡數當閉目微咽之須臾赤氣繞身變成火火因燒身身與火共作一體內外洞光良久乃止名為日月錬形死而更生旦暮夜卧常當為之則必長生不死常數存咽赤氣使人顔色反少色如童子此不死之道仙人所奉行明堂之要訣也常旦起皆咽液三十過以手拭面摩目以為常存唾色作赤津液洞房之中有三真君左為旡英公子右有白元君中為黃老君此三人真君共治洞房中此飛真之道自别有經也丹田之中有上元真一帝君夫泥丸天帝三一者乃一身之靈宗百神之命根津液之山源魂精之玉室是以胃池體方受物腦宫貟虛而適真萬毛植立千孔生煙德備天地混同太玄故名之曰泥丸泥丸者體形之上神也兆唯能知吞氣咽津鳴齒納液而不知此所因者乃泥丸之流沫腦家之邉支耳今將告子輔趣彼守一祕訣隨得為上仙之真人矣弟子受此經者齋誡四十五日畢乃傳青繒四十尺明鏡五枚金鐶二雙以為洞一之約勿宣之盟誓兩眉間上却入一寸為明堂却入二寸為洞房却入三寸為丹田丹田直上辟方一寸為玄丹腦精泥丸魂宫也明堂宫中左有明童真君右有明女真君中有明鏡神君明童真君諱玄陽字少青明女真君諱微隂字少元明鏡神君諱照精字四明此三君共治明堂宫並著錦衣腰帶四玉鈴口御玉鏡鏡鈴並赤玉也頭如嬰兒形亦如之對坐俱向外面或相向也此明堂之道也仙人所行道德所修也若道士恐怖存三神使鳴玉鈴使聲聞太極使口吐出玉鏡赤光令萬丈明堂上一寸為天庭宫洞房上一寸為極真宫丹田上一寸為玄丹宫流珠宫上一寸為太皇宫凡一頭中有九宫也其明堂洞房丹田流珠四宫之經此神仙為真人之道道傳於世其玄丹宫經亦真官司命之要言四官之領宗矣此一經須太極帝君告可與乃與之亦時出授與耳凡合五宫之道行乎世上有真名者遭值之也自非骨相挺命不聞此言又有玉帝宫有玉清神母居之又有天庭宫上清真女居之又有極真宫太極帝妃居之又有太皇宫太上君后居之此四宫皆雌真一也其道髙於雄真一也並有寶經以傳巳成真人者未得成真非所聞也雌真一之要亦自不受之矣太上所以出極八景入參瓊軒玉女三千侍真扶轅靈妃俠唱神后執巾者實守雌一之道用以髙會玄晨也太上之宗根靈王之所傳也此四宫人皆有之但不修此道者宫中空耳夫不盡修於九宫者宫中亦空耳非但雌家四宫而巳至於丹田宫中常有帝君守中常有大神不復聞須修乃見在宫中耳修之者神仙不修者以壽死矣雌雄一神者男女並兼修之旡不在也唯決精苦之至乃獲益矣玄丹太一真君之道暮夕靜寢去諸思念坐卧任意先存北極辰星紫氣來下入玄丹宫中須臾滿宫溢出身表使匝於身通洞內外與紫氣合體畢又存日來入玄丹宫中日滿宫內在紫氣中央望視如暗中覩火珠之狀畢乃存上清中黃太一真君從北極紫氣中來下八玄丹宫日中坐君諱規英字化玄衣貌服色如上又存已身忽然上入玄丹宫中在太一真君前對坐服色在意自心起再拜稽首膝前問道求神仙長生隨意言之因乃存吞紫氣三十過畢咽液三十過又存北斗七星內有二赤氣大如日徑下直入玄丹宫中於是太一君及已俱乘日入行赤氣道中直上詣北斗魁中寢良久旦因此寢亦即有真應十四年行之則與太一同遊俱到七元之綱也十六年詣上清宫受書佩符役使玉童玉女各八十人一夕一存之唯數而已勿脫一夕亦可專修此道不必須守三一也兼之益精至感速耳月一日三日七日十一日十五日夜半之時存玄丹宫中太一真君坐向外口吐青氣下入我口中隨咽之凡五十過畢乃咽液五十過祝曰太一真皇中黃紫君厥諱規英字曰化玄金牀玉帳紫繡錦裙腰帶流火之鈴斬邪滅姦手把星精頭生日真正坐吐氣使我咽吞與我共語同宴玄丹錬灌七魄和柔三魂神靈奉衛使我飛仙五藏自生還白童顔受書上清司命帝君所願所欲百福惟新又存巳上入宫中在太一前寢息也因以取眠亦當夢感妙應矣因此而數積有伺見之階漸也太上龍書云正坐玄丹不偏不邪言此道之要兆當常存太一紫氣以繞身及咽吞之也又當存太一真君在玄丹宫中如此長生無極萬凶不干玄丹之道畢也洞真素靈中經太帝君太上天帝君太微天帝君三尊君三君昔之奉受玄丹上經於太上道君施行奉修道成上輔帝王之真臨升霄之日太帝君以真經傳授西王母太上天帝君以真經傳授南極上元君太微天帝君以真經傳授金闕聖君金闕聖君以真經傳授上相青童君上相青童君以真經傳授涓子此經是素靈上篇此道髙妙非中仙所可得聞自非名書絳簡緑字太極者玄丹上經不相遭遇覩聞也道士若備修太上三真品經者位為帝皇之上公上卿也若所遭受者偏聞道有限者位為小有靈宫之王神州之卿太極中下大夫耳亦得騁龍駕雲乘飛控虛神官導衛散影八遐矣微乎深玄難以輕宣品經之目出太上隱書八素篇中有俯仰之格限夫泥丸天帝三一者乃一身之靈宗百神之命根津液之山源魂精之玉室是以胃池體方以受物腦宫貟虛而適真萬毛植立千孔生煙德備天德混同太玄素元九靈故名泥丸上府泥丸上府者大道之軀形中上神也兆唯能知之吞氣咽液鳴天鼓納液而不知此所出者乃泥丸上流之沫是腦家之邉支耳今將告子守一祕訣隨十二時為之神神皆有姓字卿庭宫府衣服光色子欲合神丹者當存此神形色男長九寸九分著五色玄黃素靈之綬頭戴七寶朱玉之幘冠旡極進賢之冠居無上之上太極朱宫七寶之府五靈鄉玄元里姓亷名銜字荒彥女長六寸六分著青寶神光錦繡霜羅九色之紱頭戴玄黃進賢之冠居無上之上崑崙太幽宫中明堂神府九光鄉太化里姓名回字弼預有此二人見者皆大仙生神丹之父毋也其元氣未立五政未開光影未通無極無窮無上無下無外無內無左無右無前無後太上之祖先元氣之父毋玄始之至妙虛極之未有元生於萬物天地得其久或居人間年命最為壽能有存思者千齡不知老亦居九天中萬神元授受夫欲合藥凡藥者合之皆先齋戒清潔藥成則有驗名之為玄丹故約須童女精丹水亦佳合丹當與童女俱合藥幽寂之處三人勿與俗人相交關三日三夕可立黃壇一所東方則有青龍制木精符用青書之南有朱雀制火精符用赤書之西方有白虎制金精符用白書之北方有玄武制水精符用黑書之中央黃龍制土精符用黃書之五色並立形像然後合藥靈沙及草藥之精皆可合之為丹也刀圭入口白日升天合藥時愼勿入厭汙合藥不成令人無命口訣云云合藥之法不可不知九天所生九地俱立凡重其知次第也名曰太清天為九天之上府第一之孫其氣清虛至尊所居清微天為上一之宫第二之孫其氣微妙是次尊所治大赤天為北一之上宫第三之孫其氣朱丹故使太陽君治之大青天為玄元之府第四之孫其氣玄逺故使虛無君治之大玄蒼天為北都官之宫第五之孫其氣玄妙故使無極君治之太玄天為北一之宫第六之孫其氣玄默故使大道君治之大皡天為七政之都府第七之孫其氣浩大旡所不容故使太上老君治之太玄都天為北平上宫第八之孫其氣清政使道德君治之太明天為陽仙萬始之宫第九之孫其氣清明使太清君治之故九天俱清九地齊立萬物咸亨隂陽日月四時五行故一氣在天天為之清一氣降地萬物咸生一之所處無不清明故天重者道人重者寶天有道不妄施人有寶不妄言為是故道重人輕耳從太𥘉太始一乃玄妙衆妙之宗也故少陽華蓋絳宫太一黃庭府大赤絳宫金宫玉室幽關俠傍玉門𥘉起玉莖𥘉生崑崙之山在玉闕之巔直上相去萬九千里其中玄妙五色琅玕上有太一下有絳宫亦能有現亦能乍亡元氣所生旡所不容道之德一則為重爾夫人生於地元始之氣旡地所生次第則萬物地上之精不敢為人作害也第一之地名曰元德其氣上青中黃是元土卿所治厚一萬一千一百一十里土家百官悉治其中第二之地皇德通黑是元庭土丞所治厚一萬一千一百一十里土家百官所治其中第三之地帝德通蒼是虎口土龍所治厚一萬一千一百一十里土家百官所治其中第四之地王德通黃是元心土大將軍所治厚亦與上同第五之地元德通赤是元福土官所治厚亦與上同第六之地地德通白是元骨土一所治厚亦與上同第七之地里德通紫是始早土父母所治厚亦與上同第八之地復德通青是始賢土宗正所治厚亦與上同第九之地昌德通緑是軒始上下二千石所治厚亦與上同其氣數是大寒鄉溺水所出夫為道士能參知此二卷所在則與天地通靈後遇奉行不經九天九地九水之考不入丘寒不經寒冷得為天上清明六律諸生輩中若道士不依教旨故入黃泉考謫地獄之中應到丘寒此雖是鬼其形骸亦毒痛苦濃潰不可忍致鬼任言虛辭真逮生男女不盡年壽皆為橫天且又女青鬼律及以詔書八卷之中鬼見自伏此素靈二篇自非名書絳簡不得與之共雜當具身中宫府神室處所百八十宫三百六十關節千二百孔萬二千精光三萬六千神主至尊所居玄聖所在三魂七魄十二形影萬音響應故使隂陽之數歷備三元頭為天元心為中元腎為下元並三萬六千神主所治名曰三元微妙分别左右故言左青右白前赤後黑中央正黃六律所出二十四氣所治各有分部元長副紳數至三萬六千變化易旡暫逃避時非是為死化立而已故使萬神置立於萬物合勢并積聚則為人氣泄則神散神散則身不能復動其真形故自隱藏俗人晚長但自不知此理無謂言永死沐沒而大小號泣此旡異百蟲至立冬一日並脫皮於孔外其形歸土中春之分驚蟄便復出其亦不知先於何處脫皮便如嬰兒𥘉生也吾每見汝輩暫出世上不學仙道不合神藥但為罪過身受謫罰竟便還汝子孫身中託形而出豈知此邪子有過罪以修功輔過以謝先愆禁忌律令所以言先人行善福流子孫行惡逆罪歸後世此皆於地下謫身未盡日竟應出故復於世上報之亦非已身行惡得之慎汝言考官日日守汝口為天關不可妄傳傳非其人奪算五十明科法庚申之日此日是身中六魄之鬼上入天府下還人身每至其日東向平坐慎勿睡勿卧祝曰五藏精神所在宫府共思如法有泄者抑之頭泄足抑之皆由師者諸藏思之術吾身左三魂在吾肝中右七魄在吾肺中百二十形影萬二千精光從吾口中天橋入上升崑崙之山范陽之郡無為之鄉朱雀導前持幢幡玄武從後負鍾鼓青龍侍左白虎侍右中央黃神把鉞斧千鬼萬神皆伏無起前有萬石鑊湯後有逆鱗反甲君為吾消災散禍吾時過故躡三綱六紀截鬼急急如律令既為道士當聽察身中視其光色便知體羸氣衰為六醜惡鬼所擊也子但日正中時於房中閉冥處內視良久乃見色暐曄暐曄光明盛者便體壯也其歲丁強塞耳反聽聞有金石之聲者及笙篁五音鍾磬聲者皆好候也若見光色羸薄聞號喪叫泣者此皆凶候也當自靖和神存真一君還治宫府之中呪曰吾形萬神安吾宫府守我玉堂不得逰走俠門力士中央童子若有非常入出者收付都市繹頭拍冒不得動作急急如律令子若見子精光羸薄子當以日月𥘉出時東向平倚祝曰溫漾溫漾精光明吞氣食影入我形扶助我身召神靈真氣還治絶邪精令我長生夀萬齡急急如律令九咽止若體中忽恍心中悲思如有所憶者復無指定心中惶惶不能自安此正是體中神欲去思慕宫府三魂已去七魄飛揚唯喻定形與邪共通夢忤輒與女子相見或見男而交通精神流泄者此皆死亡之兆也若有此候當自改更詣道士祭酒上章并自跪願申哀以立微功以暢志心從今以去當隨時修奉朝拜四尊奉行三五七九二四六八八風十二雷二十四雨三百六十電九宫八卦不得持真入偽行不正之事為考官所舉死後三官不可復赦也南方朱雀向南符亦向南西方白虎向南符向西北方玄武向南符向北中央黃龍向南符亦向東東方青龍向南符向東皆桃為版右此青龍符斬木精右此朱雀符斬火精右此白虎符斬金精右此玄武符斬水精右此黃龍符斬土精洞真太上九真明科三品律太上告諸天帝王後聖帝君上相青童太極真人曰凡是後學得見上真三洞寶章祕經首目者皆東華書名金字上清雖未超騰控轡紫庭皆是升度之人也然雖見此文而不知九真明科條檢儀式三洞竒文太真寶書不可得而便披也明科寶祕藏於玄都之宫玉京金房之內不傳於世此乃明三洞之淵賾摽衆真之儀格拔宿對於幽宫度七玄於仙籍業總絡於萬道解九隂之重責其妙可得立用其科可以肅厲今故摽出三品篇目以輔揚三竒素靈妙經可誡於後學使勤尚之人告慎於寶科諸天帝王後聖九玄帝君上相青童太極真童太極真人稽首敢問太上天尊至真上法髙秀玄澄恢落萬宗玄寂虛凝妙趣激朗法化三乘彌淪億劫量何勝任豈復稽於明科乎太上曰善子之言夫後生之徒自非玉虛之朗結自然而生者皆受孕於混氣染係於囂穢也結有不純之行性有不專之美雖希慕玄賾故心常背我舉止所乘莫不犯於過過生乎外滅命乎內承此而學豈不去真遠哉如使三官執咎對在幽司考延七祖罪纍於身有犯斯過者而使悟玄科有紏罰之制聖化之大復許有贖罪之法桉科而用此期真將必近矣為學之士而無此檢亦徒勞於精思無益於苦念也今故出九真三品明科自可授於後學應為真人者帝君上相青童太極真人於是辭退齊詣上清奉受素靈大有妙經九真明科祕於金藏玉匱衛以玉童玉女各三千人侍典靈文散香虛庭飛龍毒獸巨虬千尋奮瓜雲牆備衛玉關也如是十天大聖九宫真仙一月三過莫不上登玄宫稟承明科禮拜於靈文也上相青童君曰凡有金骨玉體名參青宫得有此文祕而施行於是承受之儀玄合上典施用節度與真同功贖罪拔難宿結咸解七七之祖於是而欣巳身升騰上宴玉宫也玄都九真明科上品傳經篇玄都上品第一篇曰大洞真經雌一寶經太上素靈大有妙經三竒之章髙上玉皇寶篇祕在九天之上大有之宫太玄靈臺玉房之中上皇之𥘉舊科經萬劫一傳三道正明學真曰興髙上正科七千年內聽得三傳侍衛玉童玉女各七千人執香典靈桉科傳授之法皆對告齋百日分金鈕為盟給玉童玉女依四極科不依科而傳罪延七祖幽魂充役吞火食鐡負山運石以填無極之源己身抱風刀之罰身沒形殘長閉地獄萬不得仙玄都上品第二篇曰傳大洞真經三十九章於後學者誓以上金十兩銅二十五斤金鈕五雙金魚王龍各一枚青絲一兩纒鈕為盟雌一以上金五兩五色錦繒各五十尺香一斤金鈕三雙太上素靈洞真玄經上金二兩紫文百尺青錦二十七尺赤絲五兩香一斤丹一兩上皇以信誓心不得有闕闕則𧇊科師犯則遷侍經玉童玉女還於本宫不過三年身被風刀之拷自然失經受者不依明科目皆失明形殘七祖父毋充北酆之責萬劫還生非人之道學者慎之玄都上品第三篇曰凡有金名東華玉字上清得受太霄琅書瓊文帝章紫度炎光玄真變經上清變化七十四方九真中經丹景道精隱地八術解形遁變流景玉經七變儛天皆九天真王元始天王太上天帝君中央黃老君受於太空之中九玄之內虛旡之髙章也皆祕在大上靈都之官紫房之內三元君主之侍衛玉童玉女皆三千人元始之𥘉經七年千劫一傳自三道立正之後七年內聽三傳七百年中有人亦聽傳傳皆對齋九十日或三十日或九日告盟而授之給玉童玉女依四極明科若不依科而傳罪延七祖父毋充責鬼官運濛山之石填積夜之河萬劫還生非人之道巳身被風刀之拷自然失經終不得仙傳者慎之玄都上品第四篇曰傳瓊文帝章賫金魚玉龍青繒三十二尺金鈕三雙之誓紫度炎光五色錦各五十尺金五兩沉香五斤真珠一斤書刀一口金魚七枚絳紋七十尺之誓上清變化七十四方青繒四十尺上金十兩金鈕六雙好香一斤金魚玉龍之誓九真中經具科落髮為盟今以白絹九十尺準盟法於九真之數青絲一斤絳紋二十尺此日暉之誓碧繒二十四尺月華之誓金鐶三雙旡常童子質變之信丹景道精隱地八術解形化變流景玉經悉上金十兩金魚玉龍各一枚青繒三十尺綮紋四十尺金鐶各三雙七變儛天上金五兩香一斤青繒三十二尺之誓信以質心不得有閥關則違科師以天信投於山栖或投於川栖以救窮乏餘以供營經書之具不得他散師犯上科奪玉童玉女減算奪紀注名度還北酆受者不依科皆喪魂失神風刀之拷不出三年自然失經終不得仙玄都上品第五篇曰消魔智慧玉清隱書寶洞飛霄絶玄金章紫鳳赤書八景晨圖金真玉光靈書紫文金璫玉珮金根上經三天正法皆太上道君元始天王金闕帝君之寶章祕在玉清之宫金房紫户之內典衛靈文玉童玉女各三千人元始之𥘉皆千劫一傳自三天立正之後七百年內聽得三傳百年中有其人聽一傳給玉童玉女依四極明科授者對齋九十日或三十日或九日而傳不依科不傳罪延七玄九祖長充鬼役無有解脫已身被風刀之栲死充下鬼萬不得仙玄都上品第六篇曰傳消魔智慧寶洞飛霄絶玄金章紫鳳赤書八景晨圖皆上金十兩玉札一枚金魚玉龍各一枚紫繒四十尺金根衆經靈書紫文上金五兩金簡玉札各一枚長一尺六寸廣二寸四分金魚玉龍各一枚紫繒百尺青紋四十尺三天正法青䌝四十尺青布四十三尺金鐶五雙以為密擔上金十兩通神之信金真玉光玉珮金璫玉清隱書皆金魚玉龍各一枚以為誓信依科不得有闕闕之則師奪玉童玉女注名還度北酆受者皆喪魂失神拷之以風刀不出三年自然失經萬不得仙玄都上品第七篇曰七星移度白羽黑翮飛行羽經飛步天綱躡行七元太上隱書靈飛六甲皆太上太帝君太微天帝君登空之道隱化之祕章祕在太上瓊宫之上紫房之內侍衛玉童玉女皆三千人依科七千年一傳三天立正之後攺七百年內聽得三傳若百年中有其人便傳傳授告齋九十日或三十日給玉童玉女依四極明科不依而傳罪延七玄七祖長充北酆鬼役十苦八難巳身被風刀之栲身沒幽原萬不得仙玄都上品第八篇曰傳七星移度青紋四十一尺絳繒七十尺鳳文之羅九十尺金鈕一雙白羽經金二兩青繒三十二尺以代截髮歃血之誓飛步天綱錦三十尺金魚玉龍各一枚太上隱書金魚玉龍之誓靈飛六甲素紋六十尺金鐶六雙青絲六兩天科以信質心不得有闕闕則違玄科師奪玉童玉女除落青簿玉名移還北酆受者不依科亡精喪神罰以風刀不出三年自然失終終不得仙玄都上品第九篇曰諸方丈震靈豁落七元八天隱文流金火鈴金神虎符消魔支幹夜照神燭八術隱遁紫清玉符五籍洞玄六甲上符五行祕文玄都玉格諸符凡有六百部太上悉以其文標於舊經之內以為立用傳授盟科悉依經科傳授有闕罪同上品有經旡符則天魔害人有符無經則思念無感神真不降科云皆不得單行單行罪亦如之科經及符本同出於自然之氣虛無之章旨故不可得獨修也無科修道萬不成也玄都九真科中品誡罪篇左玄都中品第一篇曰是諸後學七祖以下有殺害人命劫賊攻掠謀圖姦淫篡逆之過九族交通謀反無道其考尤重𡨚對咎逮積結九隂非赦所原後生皆不得以餘殃之身參染真經𥨸受寶文若有苦至志尚自厲首謝七玄重施功德拔出幽魂披露巳身於三光之下散髻叩頭三年不倦自賫重信投九江贖解前咎然後聽得清齋百日奉受寶經然後行事有此之罪而不先自罰責吐首天寶而受法者師及弟子同被風刀之拷七玄之祖長閉幽原負石擔山萬劫不解身亡失經明慎之焉玄都中品第二篇曰凡欲修學上法巳身先有重罪手殺人命及酷虐下賤煞害衆生劫掠百姓謀圖姦宄九族相交嫉姤賢能代逆師主不赦之罪積結九隂皆不得參受妙法修行經文若能苦志吐首先犯效功施德披露三光散髻叩頭三年陳謝罰信投河以贖巳愆拔出七玄使三界右别然後得清齋百日奉受寶經行事有此之罪而不先自首謝責罰自厲而受經文師及弟子同受風刀之拷魂魄十苦八難身沒幽泉自然失經七祖父毋長充幽𡍼萬劫不解學者慎之玄都中品第三篇曰凡是學者受三竒寶文上清祕經而輕泄目録以示不固宣露妙祕輕慢寶章者一犯至十罰功斷事三年然後更齋修行過此以上皆罪結九隂考延七祖充役三塗運石負山十苦八難經萬劫得還更生不人之道已身罰以風刀之拷失明形殘死充下鬼萬不得仙奉者慎之玄都中品第四篇曰凡是學者受上清寶經三竒寶文不得哭泣臨見死尸及血穢之厭一犯至十罰功斷事一年然後得依科自罰拔罪太隂更清齋行事過此以上二十四犯奪算減命玉童玉女還於本宫不出三年失經身喪七玄之祖長充鬼役萬劫不解學者慎之玄都中品第五篇曰凡學者受上清寶經三洞祕文不得帶近婦人及行穢濁之處皆是混汙真氣十犯至二十四過罰功斷事三百日然後更清齋修行過此以上玉童玉女各還本宫減算促命不出三年失經亡身七祖被拷學者慎之玄都中品第六篇曰凡學者受上清寶經三洞祕文而心懷賊害手行逆暴殺生行凶攻掠姦宄嫉賢妬能攻毀同氣伐敗經師一犯至十聽得罰信謝責九隂拔罪五嶽斷功禁事十年聽清齋還修所受過五以上至二十四犯四司執殺收攝魂神充責北酆七祖充役經萬劫得還更生非人之道玉童玉女各反上宫不出一年失經身亡終不得仙學者慎之玄都中品第七篇曰凡學者受上清寶經三洞祕文不得北向便溺及食五辛六畜之肉飲酒任性戲道慢法疑惑不專十犯至二十四過聽得依科罰信謝過太隂斷功一年然後聽清齋九十日還修所受過此以上減算促命身被風刀之拷七玄充責三塗不過五年失經身亡學者慎之玄都中品第八篇曰凡學者受上清寶經三洞祕文當依科賫信詣師告齋然後受經不得不告盟而妄披寶文凡詣常人得經便師而受焉此皆冥使授之不得輕略𥨸寫及改易聖文以意通決毀名古音自作一法四司所糾罪書九隂一犯至三斷功禁事三年按科自罰投信九河更清齋三十日然後得還修行過此以上至二十四過玉童玉女各還本宫減算奪命身沒鬼官七玄之祖長遭鬼役經萬劫得還更生非人之道學者慎之玄都中品第九篇曰凡受上清寶經三洞竒文當別室安髙牀髙四尺四寸廣五尺以請三洞寶經明燈燒香朝夕禮願常為供養不得使異氣之人冒殗履穢及婦人參入室內觸忤神真此世間所用之科受經之身不得衣服履屐交關非類卧息坐起皆與物有異犯者從一至二十四過罰功斷事一年然後更清齋修行過此以上為四司所執言過玉清還名酆都七年身亡失經七祖被拷奉者慎之玄都九真明科下品贖罪篇玄都下品第一篇曰凡有後學之人七祖父母生世有犯玄都上品中品第一篇之罪其考尤重結在九隂七祖怨對幽掠纍劫殃充後代冥逮不釋者皆當露身太隂之下披散叩頭首罪九隂三年自責年竟賫金鐶九雙青絲一兩金人一軀投於三河之口以贖七祖之罪拔出幽魂之難其科朱書五行桐版一枚記曰某年某月某子朔如干日某子某郡縣鄉里王甲七祖父毋下逮已身有犯玄都上品中品第一篇之罪罪結九隂今謹依科罰金鐶九雙青絲一兩金人一軀以贖幽魂酷對之辜投書告命歸首水官以自解拔罪滅三官魂升九天畢次以青絲纒物及版以青石沉之臨沉之時北向仰頭祝曰太隂九君執司靈官甲今有言歸告河源投信九泉拔出七祖𡨚對解脫我身登仙畢如此七祖之拷於是釋散得離幽宫上升福堂已身便得參修寶經九年尅有真靈降形與神同升也玄科尤重不得又犯玄都下品第二篇曰凡欲修學上真之道若巳身先有犯上品中品第二篇中之罪其考沉結結罪九隂盤塞冥中上延七祖拷對窮魂纒綿不解者皆當先於太隂之下北向散髮叩頭首罪三光三年尅責年竟當賫真珠一斤書刀一枚青絲一兩金人一軀投於三河之口以贖已身酷逆之過解結三官拔出七祖其科朱書青繒一尺上記曰某年某月某朔某日某子某郡縣鄉里王甲年如干歲甲身先旡所見行失玄科身犯元惡上罹玄都上品中品第二篇之罪罪結太隂今以依科罰金人一軀真珠一斤書刀一口以贖巳身醜惡之罪投書告命歸首有靈以自解拔罪滅九河身得長生畢以青絲纒物及版以青石沉之臨沉之時北向叩頭呪曰上有太隂執司九君甲今有言歸告河源贖罪解結拔度九難𡨚魂對魄各反自然禍滅學仙我身得升畢如此九隂之結便得解釋𡨚對之魂反於自然也便得修受上清之經九年不𧇊真靈降形與神合冥也玄科嚴重不得又犯玄都下品第三篇曰凡修上清寶經洞玄科文已身有犯於上品中品第三篇之罪共考結於太陽四司所執言奏玉清犯此之過當斷功克已入室燒香叩頭首謝北向叩齒十通仰祝曰太玄幽邈下世希聞輕泄寶真上𧇊帝尊自取罪負伏欵靈門伏願髙上曲垂玄恩降以靈感啓以自然畢便以叩頭九過如此三年首謝更清齋三十日得上解三官解考九隂便還修行寶祕密念尅得飛仙玄科尤重不得又犯也玄都下品第四篇曰凡修學上真之道已身有犯上品中品第四篇目之罪罪結九隂懸考玉清犯者當於中庭夜半然三十二燈以洗穢氣清明內外入室燒香北向叩頭首謝所犯叩齒三十六通仰頭祝曰世運交喪蜚尸翳障穢氣紛紛與真相迎虧犯科誡身入罪鄉贖以禮謝洗以明燈禍散三清福充我昌道廕曲流其慶靡央畢又叩頭九過止如此一年更清齋三十日然後得還修事檢行慎科勤苦注真九年剋得白日登晨玄都下品第五篇曰凡修上真之道巳身有犯上品中品第五篇目之罪罪結太隂考懸青官犯者當作香湯沭浴賫油於中庭然二十四燈九十日入室北向叩頭九過首謝所犯叩齒二十四通仰頭呪曰天地乾坤二象交通隂氣混正穢氣彌充喪神虧寶損落法容謹然明燈上映玄宫禍滅九隂福慶歸宗畢如此九十日竟退齋二十四日然後得還修行真法每在告慎明依科文剋得玄真與形合仙玄科尤重不得又犯也玄都下品第六篇曰凡修上真之道己身有犯上品中品第六篇目之罪其罪尤重為四司所執考結九隂對在幽宫有犯當於太隂之下披散叩頭首謝玉清解拔太隂依科當以𥝠寶散乞貧民隨力作食以施飢乏十年入室叩頭自責北向叩齒九通仰祝曰天遐地廣九原開張身履禍門懸罪玉京俠羅纒絡玄洞雲場散寶拔罪施以窮糧罪消太隂福生十鄉去故奉新方𨺚未央畢又叩頭九過止此乃髙上拔罪上法摽於正科十年如此宿罪滯考並消太隂施行自責年竟更齋百日後得還修行檢身慎法不得重犯玄都下品第七篇曰凡學上真之道有犯上品中品第七篇目之罪罪充上清犯者當以上香十斤送同學之人合十處拔罪一年入室燒香東向叩頭九過首謝上真叩齒九過仰祝曰五氣錯綜上真不全身染穢氣觸忤洞門傷藏伐命搖動三關違科犯戒罪考自延謹以罰責歸告帝尊乞丐使我於今自宣去離下世上登天仙畢如此一年年竟更齋二十四日還修所受剋得真下降明科之大不得重犯玄都下品第八篇曰凡學上真之道犯上品中品第八篇目之罪為監司所執考結三清犯者當以清油一斛於中庭然燈多少隨意惟令油盡又以上香十斤奉有經之師以拔其過三年入室燒香北向叩頭九過首謝所犯叩齒十二通仰祝曰天真髙逺玄光下明緣恃宿慶得覩真經未獲玄科虧略天靈違真犯戒沉身分冥克自責厲歸告上清自是之後洗濯故形奉承玄真與道齊并畢三年周竟當更齋九十日先以師受便得修行未經師受當賫信詣師度經修行如法剋得上升玄科尤重不得又犯玄科下品第九篇曰凡修上真之道有犯上品中品第九篇目之罪罪結於太隂懸考於玉清犯者當然七燈於堂前入室叩頭首罪經前叩齒二十四通仰祝曰玉光垂耀仰徹上清執躬不禮虧犯寶經恐為四司列罪紫庭謹重齋敬仰希真靈曲垂下降滅罪消形攝奉玄科永保元貞畢如此一年更齋二十四日然後得還奉修所受玄科尢重冝自明慎不得又犯右太玄九真明科三品二十七條出自太上靈都之宫太上常所寶祕不宣下世今抄立用要訣以付後聖輔明三竒摽於大有素靈之經有骨分合仙便得此文施用拔罪解咎釋結散理七玄將無三年真靈見形與子合并同升九天輕泄玄科罪同上文唯在寶祕密而奉行玄都九真篇曰傳授經目在九真三品科中者是後聖帝君始佩經之時受於太上道君太上授經出三品明科以輔三寶竒文上真道經施用之科格其三十一卷獨立餘事及衆經儀品悉在四極明科之中九真三品以三素之上篇置於九帝之宫四極以四司之官總統衆非糾罰之禁律太真明科以太帝君所受元始天王天王之玄章上真之儀格其法祕於九天之上太帝之堂藏誡於上真之宫不行於世九真明科以禁後學四極明科總領四逹其旨幽微自無金字玉名不得知聞有得此篇不須學而自成科以禁罪見科知攺知攺則旡𧇊於天地無虧於天地則合自然合於自然便得上輔真仙也無科而學去仙將為遠哉玄都九真篇曰凡有至志名參玄宫欲單受明科知天法禁然後受經審有骨分亦可先告盟而授之盟信法物悉依三竒寶經之數年限亦同知之不得輕泄付非其人宣露玄文不依科旨死沒鬼官七祖父毋履刀山劔樹萬劫不原外好不依科旨罪同科文彼此之禁學者慎焉玄都九真篇曰凡受上法而不承明科虧略天禁罪纍七祖考逮一身既知攺首罰責自厲還修所受而回又犯其考倍先此則骨命不合形與真反魄同鬼伍皆不得重首復修於真經也吾今故以明科悟於未悟既知而犯將何要哉奉者慎之太帝君偈讃翳翳無化初眇眇晨霞散太寂空玄上寥朗二儀判凝精抱玄胎結化孕靈觀含真頥神內倏欻啓冥旦始悟憂促齡還交反天漢蕭蕭步虛遊旋行禮玉皇稽首歸太無乘風散靈香俯仰帝皇堂飄揚隨虛翔妙唱發竒音吟詠太真章流廣四大界十天量無央閬臺發幽夜神燭吐竒光璀璨玉林華熠爍耀瓊堂虛生自然煙蓊鬱御玄綱群真披霄讃寶蓋順風昂飛步詠空歌神唱化道長鬱鬱大化𨺚濟濟玄道興積學隨日感功滿入大乘福慶逮一切七祖咸得升整駕凌太華回轡絶霄館靈風鼓空洞香花乘煙散蕭蕭禮虛堂詵詵步玄漢朗詠感幽襟拔度宿根難五苦應時解流芳注淘灌玄關峙雲綱飛霞翼靈輿授擕無迹真窈窕入太虛乘空誦玉篇蕭條詠羽書廣念無不普一切慶有餘天帝君誦至道生寂寂玄響音相求三真不無一氣化理還殊法輪無影內飄飄清觀流凝章不待思結氣合玄符靈唱發空歌吟詠步虛逰玄化本無迹生道宗遨逰九天際息駕六領宫提擕髙上賔反我素房中至道虛漢內靈歌發太空形感至寂庭思詠希微通雲光翳晨暉停曜廕玉房玄龍不待駕蕭蕭步虛翔手掇七寶華靈風散竒香妙詠乘袊發粲粲啓玉章萬氣混元一總歸三玄梁乘天不云髙遐望九玄遼振翮思玄轡希登幕雲霄積念告靈感期與玉真交曖曖天漢澄飄飄景雲回三真騰空上控轡迅紫微明唱度後身咸令乘景飛拔出三塗難九玄離苦哀太微天帝君誦太真生空洞瓊羅耀寶臺旋行禮玄京衆仙唱微詩回轉無迹內虛歌契幽期度身上生天吟詠積福基䇿轡太霞館時復宴景雲飄飄旡崖際離苦入玄門意適道亦暢心丹志亦分積學隨日新詠我素靈文八景運天輿飛霄蔚玄靈素蓋乘風廽寥寥入紫清妙讃萬真曲玉響何玲玲披拔九隂籍度身反南庭慶流普一切妙化靡不榮清淨可道宗明朗煥太空妙化由靜默潛想三素宫積念徹玄虛微微至道通叩詠嚮玄寂靈唱靡不𨺚丹暉映雲庭紫煙耀玉林煥爛七寶華璀璨搖靈音宫啇自相和妙趣傾人襟玄唱種福田廣度無界心後聖金闕帝君誦眇莾元始天三象混玄一蕭蕭正道興浩浩大乘逸六氣還正庭總歸泥丸室出入逰帝宫流精曜雲日運周返天漢窈窕乘玄七貟華映明珠二景對真光靈暉啓朔會玄象交扶桑冥度自相求隂暢朗八芒若能餐此精長得御玄綱逰戲九玄臺解憩西羽阿神獸鳴瓊堂飛鳳互參差虛生自然詠真人唱節和化身劫刃庭緣香命清歌建功立福田拔度身上羅七玄散幽宫出離無艱那飛步躡霄嶺翔翮東華宫風雲虛中唱玉音散瓊堂真人詠空歌妙響絶雲房解我自然襟成我積劫功長嘯九玄上清曯覩空同龍吟絶宅府鳳嘯太霄館虛唱旡留味哀音乘風散誰能究此章精誦素靈讃以解九隂過拔度七玄難太極真人曰太上素靈洞元妙經以元始同生靈文既存衆真詣座燒香禮經旋行誦此二十一篇之章以慶於神庭也玉音激朗清徹九天其句幽微妙趣傍通詠誦一過萬神啓靈帝能究習與帝合真解宿對之重責拔七玄於幽宫釋五苦於愁魂度身生於上天妙乎微哉斯之靈文也洞真太上道君元丹上經
